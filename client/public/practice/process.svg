<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" font-family="Arial, sans-serif" font-size="13">
  <rect width="680" height="400" fill="#fff"/>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#b3261e"/></marker></defs>
  <text x="340" y="28" text-anchor="middle" font-size="16" font-weight="bold">How recycled paper is produced</text>
  <g fill="#f5f3ea" stroke="#1f1f1f">
    <rect x="30" y="70" width="170" height="70" rx="6"/><rect x="255" y="70" width="170" height="70" rx="6"/><rect x="480" y="70" width="170" height="70" rx="6"/>
    <rect x="480" y="250" width="170" height="70" rx="6"/><rect x="255" y="250" width="170" height="70" rx="6"/><rect x="30" y="250" width="170" height="70" rx="6"/>
  </g>
  <g text-anchor="middle"><text x="115" y="100" font-weight="bold">1. Collection</text><text x="115" y="120">used paper from homes</text>
  <text x="340" y="100" font-weight="bold">2. Sorting</text><text x="340" y="120">by type and grade</text>
  <text x="565" y="100" font-weight="bold">3. Pulping</text><text x="565" y="120">mixed with water</text>
  <text x="565" y="280" font-weight="bold">4. Cleaning</text><text x="565" y="300">ink and plastic removed</text>
  <text x="340" y="280" font-weight="bold">5. Pressing &amp; drying</text><text x="340" y="300">between heated rollers</text>
  <text x="115" y="280" font-weight="bold">6. Rolling</text><text x="115" y="300">new paper sent to shops</text></g>
  <g stroke="#b3261e" stroke-width="2.5" fill="none" marker-end="url(#a)">
    <line x1="202" y1="105" x2="252" y2="105"/><line x1="427" y1="105" x2="477" y2="105"/><line x1="565" y1="142" x2="565" y2="246"/>
    <line x1="478" y1="285" x2="428" y2="285"/><line x1="253" y1="285" x2="203" y2="285"/>
  </g>
</svg>
