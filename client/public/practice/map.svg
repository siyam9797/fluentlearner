<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 380" font-family="Arial, sans-serif" font-size="12">
  <rect width="700" height="380" fill="#fff"/>
  <text x="350" y="26" text-anchor="middle" font-size="16" font-weight="bold">Riverside village, 2000 and today</text>
  <g transform="translate(20,45)">
    <text x="160" y="0" text-anchor="middle" font-size="14" font-weight="bold">2000</text>
    <rect x="0" y="12" width="320" height="300" fill="#f5f3ea" stroke="#333"/>
    <path d="M0,250 C80,230 160,280 320,240 L320,275 C160,315 80,265 0,285 Z" fill="#a9c7e8"/><text x="150" y="275" text-anchor="middle">River</text>
    <rect x="150" y="12" width="16" height="230" fill="#cfcfcf"/>
    <g fill="#9ccc8a" stroke="#6b9a5a"><rect x="20" y="40" width="110" height="80"/><rect x="190" y="40" width="110" height="120"/></g>
    <text x="75" y="84" text-anchor="middle">Farmland</text><text x="178" y="200" transform="rotate(-90 178 200)" text-anchor="middle" font-size="11" fill="#555">Main road</text><text x="245" y="104" text-anchor="middle">Forest</text>
    <g fill="#1f1f1f"><rect x="30" y="150" width="20" height="16"/><rect x="60" y="150" width="20" height="16"/><rect x="90" y="150" width="20" height="16"/></g>
    <text x="70" y="185" text-anchor="middle">Houses</text>
    <rect x="190" y="180" width="50" height="30" fill="#e7a29c" stroke="#b3261e"/><text x="215" y="199" text-anchor="middle">Shop</text>
  </g>
  <g transform="translate(360,45)">
    <text x="160" y="0" text-anchor="middle" font-size="14" font-weight="bold">Today</text>
    <rect x="0" y="12" width="320" height="300" fill="#f5f3ea" stroke="#333"/>
    <path d="M0,250 C80,230 160,280 320,240 L320,275 C160,315 80,265 0,285 Z" fill="#a9c7e8"/><text x="60" y="285" text-anchor="middle">River</text>
    <rect x="150" y="12" width="16" height="230" fill="#cfcfcf"/><rect x="140" y="232" width="36" height="46" fill="#9a9a9a"/><text x="158" y="300" text-anchor="middle">Bridge</text>
    <g fill="#1f1f1f"><rect x="25" y="40" width="20" height="16"/><rect x="55" y="40" width="20" height="16"/><rect x="85" y="40" width="20" height="16"/><rect x="25" y="70" width="20" height="16"/><rect x="55" y="70" width="20" height="16"/><rect x="85" y="70" width="20" height="16"/><rect x="30" y="150" width="20" height="16"/><rect x="60" y="150" width="20" height="16"/><rect x="90" y="150" width="20" height="16"/></g>
    <text x="68" y="112" text-anchor="middle">New housing</text>
    <rect x="190" y="40" width="110" height="60" fill="#9ccc8a" stroke="#6b9a5a"/><text x="245" y="74" text-anchor="middle">Park</text><text x="178" y="200" transform="rotate(-90 178 200)" text-anchor="middle" font-size="11" fill="#555">Main road</text>
    <rect x="190" y="115" width="110" height="45" fill="#fff" stroke="#333"/><text x="245" y="142" text-anchor="middle">School</text>
    <rect x="190" y="180" width="80" height="30" fill="#e7a29c" stroke="#b3261e"/><text x="230" y="199" text-anchor="middle">Supermarket</text>
    <rect x="30" y="185" width="80" height="30" fill="#ddd" stroke="#333"/><text x="70" y="204" text-anchor="middle">Car park</text>
  </g>
