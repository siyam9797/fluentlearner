<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" font-family="Arial, sans-serif" font-size="13">
  <rect width="640" height="420" fill="#fff"/>
  <text x="320" y="28" text-anchor="middle" font-size="16" font-weight="bold">Visitors to three museums in a city, 2000–2020 (thousands)</text>
  <g stroke="#e3e3e3">
    <line x1="70" y1="340" x2="600" y2="340"/><line x1="70" y1="290" x2="600" y2="290"/><line x1="70" y1="240" x2="600" y2="240"/>
    <line x1="70" y1="190" x2="600" y2="190"/><line x1="70" y1="140" x2="600" y2="140"/><line x1="70" y1="90" x2="600" y2="90"/>
  </g>
  <line x1="70" y1="340" x2="600" y2="340" stroke="#333"/><line x1="70" y1="60" x2="70" y2="340" stroke="#333"/>
  <g text-anchor="end" fill="#444"><text x="62" y="344">0</text><text x="62" y="294">100</text><text x="62" y="244">200</text><text x="62" y="194">300</text><text x="62" y="144">400</text><text x="62" y="94">500</text></g>
  <g text-anchor="middle" fill="#444"><text x="80" y="360">2000</text><text x="210" y="360">2005</text><text x="340" y="360">2010</text><text x="470" y="360">2015</text><text x="590" y="360">2020</text></g>
  <!-- values: history 300,320,280,250,200 ; science 150,200,280,360,450 ; art 100,110,120,180,210 -->
  <polyline fill="none" stroke="#b3261e" stroke-width="3" points="80,190 210,180 340,200 470,215 590,240"/>
  <polyline fill="none" stroke="#1f1f1f" stroke-width="3" points="80,265 210,240 340,200 470,160 590,115"/>
  <polyline fill="none" stroke="#8a8a8a" stroke-width="3" stroke-dasharray="7 5" points="80,290 210,285 340,280 470,250 590,235"/>
  <g font-size="13"><rect x="110" y="380" width="18" height="4" fill="#b3261e"/><text x="134" y="386">History museum</text>
  <rect x="270" y="380" width="18" height="4" fill="#1f1f1f"/><text x="294" y="386">Science museum</text>
  <rect x="430" y="380" width="18" height="4" fill="#8a8a8a"/><text x="454" y="386">Art gallery</text></g>
</svg>
